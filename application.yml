eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
        
spring:
  kafka:
    bootstrap-servers: kafka:29092
  datasource:
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}